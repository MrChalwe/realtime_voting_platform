<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Voting | Get Kreative Media</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="hero">
    <img src="logo.png" alt="Get Kreative" class="gk-logo" onerror="this.style.display='none'"><br>
    <div class="gk-wordmark mb-2">Get <b>Kreative</b> Media</div>
    <small>🗳️ LIVE VOTING</small>
    <h1 id="title">Youth Sunday</h1>
  </div>

  <div class="container-narrow" id="app">
    <div class="text-center py-5 text-muted">
      <div class="spinner-border text-primary"></div>
      <p class="mt-3">Getting things ready…</p>
    </div>
  </div>

  <div class="gk-footer">A <b>Get Kreative Media</b> project<br>Creating moments worth remembering</div>
  <div id="flash" class="flash d-none"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    let room = null, parts = [], myVote = null, uid = null, tab = "vote", chan = null, timer = null;
    init();

    async function init() {
      try {
        let { data: { session } } = await sb.auth.getSession();
        if (!session) {
          const { data, error } = await sb.auth.signInAnonymously(); // no sign-up form, voter stays anonymous
          if (error) throw error;
          session = data.session;
        }
        uid = session.user.id;
        await loadRooms();
      } catch (e) { fail(e.message); }
    }

    function fail(m) {
      $("#app").innerHTML = `<div class="alert alert-danger">Oops, something went wrong: ${esc(m)}<br>Please refresh the page.</div>`;
    }

    async function loadRooms() {
      let q = sb.from("rooms").select("*").in("status", ["open", "closed"]).order("created_at", { ascending: false });
      const id = new URLSearchParams(location.search).get("room");
      if (id) q = q.eq("id", id);
      const { data, error } = await q;
      if (error) return fail(error.message);
      if (!data.length) {
        $("#app").innerHTML = `<div class="text-center text-muted py-5"><div class="display-4">⏳</div>
          <p class="mt-2">Voting hasn't started yet. Hang tight!</p>
          <button class="btn btn-outline-primary" onclick="loadRooms()">Refresh</button></div>`;
        return;
      }
      if (data.length === 1) return openRoom(data[0]);
      window._rooms = data;
      $("#app").innerHTML = "<h5 class='mb-3'>Choose a session</h5>" + data.map(r => `
        <button class="btn btn-light card-p w-100 text-start p-3 mb-2" onclick="openRoom(window._rooms.find(x=>x.id==='${r.id}'))">
          <b>${esc(r.title)}</b><br><small class="text-muted">${esc(r.description || "")}</small>
        </button>`).join("");
    }

    async function openRoom(r) {
      room = r;
      $("#title").textContent = r.title;
      await refresh();
      if (chan) sb.removeChannel(chan);
      chan = sb.channel("room-" + r.id)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "room_id=eq." + r.id }, refresh)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: "id=eq." + r.id }, (p) => { room = p.new; render(); })
        .subscribe();
      clearInterval(timer);
      timer = setInterval(refresh, 15000); // safety net if the connection drops
    }

    async function refresh() {
      const [p, v] = await Promise.all([
        sb.from("participants").select("*").eq("room_id", room.id).order("vote_count", { ascending: false }).order("created_at"),
        sb.from("votes").select("participant_id").eq("room_id", room.id).maybeSingle(),
      ]);
      parts = p.data || [];
      myVote = v.data?.participant_id || null;
      render();
    }

    function setTab(t) { tab = t; render(); }

    function flash(msg) {
      const f = $("#flash"); f.textContent = msg; f.classList.remove("d-none");
      setTimeout(() => f.classList.add("d-none"), 2200);
    }

    function render() {
      const open = room.status === "open";
      const total = parts.reduce((a, b) => a + b.vote_count, 0);
      let h = `
        <div class="d-flex justify-content-between align-items-center mb-2">
          ${open ? '<span class="badge text-bg-success">Voting open</span>' : '<span class="badge text-bg-secondary">Voting closed</span>'}
          <small class="text-muted">${total} vote${total === 1 ? "" : "s"} so far</small>
        </div>
        ${room.description ? `<p class="text-muted small">${esc(room.description)}</p>` : ""}
        <ul class="nav nav-pills nav-fill mb-3">
          <li class="nav-item"><a class="nav-link ${tab === "vote" ? "active" : ""}" href="#" onclick="setTab('vote');return false">🗳️ Vote</a></li>
          <li class="nav-item"><a class="nav-link ${tab === "live" ? "active" : ""}" href="#" onclick="setTab('live');return false">📊 Live results</a></li>
        </ul>`;
      h += tab === "vote" ? voteView(open) : resultsView(total);
      $("#app").innerHTML = h;
    }

    function voteView(open) {
      if (!parts.length) return `<p class="text-center text-muted py-4">No participants yet.</p>`;
      const list = [...parts].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); // stable order while voting
      const note = open
        ? (myVote ? `<div class="alert alert-success py-2 small">✅ Your vote is in! You can change it until voting closes.</div>`
                  : `<div class="alert alert-info py-2 small">Tap <b>Vote</b> on the one you liked most. One vote per person.</div>`)
        : `<div class="alert alert-secondary py-2 small">Voting is closed. Check the Live results tab!</div>`;
      return note + list.map(p => `
        <div class="card card-p mb-3"><div class="card-body">
          <h5 class="mb-0">${esc(p.name)}</h5>
          <div class="text-primary fw-semibold">${esc(p.project)}</div>
          ${p.description ? `<p class="text-muted small mt-2 mb-3">${esc(p.description)}</p>` : '<div class="mb-3"></div>'}
          ${open ? (myVote === p.id
            ? `<button class="btn-voted w-100" disabled>✓ Your vote</button>`
            : `<button class="btn-brand w-100" onclick="castVote('${p.id}')">${myVote ? "Switch my vote here" : "Vote"}</button>`) : ""}
        </div></div>`).join("");
    }

    function resultsView(total) {
      if (!parts.length) return `<p class="text-center text-muted py-4">No participants yet.</p>`;
      let h = "";
      if (room.status === "closed" && total > 0) {
        const top = parts[0].vote_count, tied = parts.filter(p => p.vote_count === top);
        h += `<div class="alert alert-warning text-center fw-bold">🎉 ${tied.length > 1 ? "It's a tie: " + tied.map(p => esc(p.name)).join(" & ") : "Winner: " + esc(parts[0].name)}</div>`;
      }
      return h + leaderboardHTML(parts);
    }

    async function castVote(pid) {
      if (room.status !== "open") return;
      const { error } = await sb.from("votes").upsert(
        { room_id: room.id, participant_id: pid, voter_id: uid },
        { onConflict: "room_id,voter_id" });
      if (error) return alert("Could not save your vote: " + error.message);
      myVote = pid;
      if (navigator.vibrate) navigator.vibrate(60);
      flash("Vote saved ✅");
      await refresh();
    }
  </script>
</body>
</html>
