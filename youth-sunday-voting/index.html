<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b3df5">
  <title>Live voting | Get Kreative Media</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="wrap">
    <section class="bento" id="hero">
      <div class="tile t-brand hero-title">
        <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>Get Kreative Media</span></div>
        <h1 id="title">Live voting</h1>
        <p class="lede" id="desc"></p>
      </div>
      <div class="tile t-sun stat" id="tVotes" hidden>
        <div class="num" id="nVotes">0</div>
        <div class="cap" id="capVotes">votes so far</div>
      </div>
      <div class="tile t-white stat" id="tState" hidden>
        <div class="num word"><span class="dot" id="stateDot"></span><span id="stateWord">Open</span></div>
        <div class="cap" id="stateCap">one vote each</div>
      </div>
      <div class="tile t-sky mine" id="tMine" hidden>
        <div class="cap" id="mineCap">Your vote</div>
        <div class="big" id="mineBig">Not yet</div>
      </div>
    </section>

    <div id="msg" style="margin-top: 12px"></div>

    <div class="seg" id="tabs" hidden>
      <button type="button" id="tabVote" aria-pressed="true">Vote</button>
      <button type="button" id="tabLive" aria-pressed="false">Live results</button>
    </div>

    <section id="voteView" hidden></section>

    <section id="liveWrap" hidden>
      <p class="hint" id="liveNote"></p>
      <div class="bento" id="board"></div>
    </section>

    <p class="foot">A Get Kreative Media project</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script>
    let room = null, parts = [], myVote = null, uid = null, tab = "vote";
    let chan = null, timer = null, waitTimer = null, voteSig = "", busy = false;

    $("#tabVote").onclick = () => setTab("vote");
    $("#tabLive").onclick = () => setTab("live");
    $("#voteView").addEventListener("click", (e) => {
      const b = e.target.closest("[data-vote]");
      if (b) castVote(b.dataset.vote);
    });
    init();

    function msg(html) { $("#msg").innerHTML = html; }

    async function init() {
      msg('<div class="note">Getting things ready…</div>');
      try {
        let { data: { session } } = await sb.auth.getSession();
        if (!session) {
          // No sign-up form: each phone gets a random anonymous ID, so votes stay anonymous.
          const { data, error } = await sb.auth.signInAnonymously();
          if (error) throw error;
          session = data.session;
        }
        uid = session.user.id;
        await loadRooms();
      } catch (e) { fail(e.message); }
    }

    function fail(m) {
      msg('<div class="note"><b>We couldn\'t connect to the voting service.</b>Check your internet connection, then refresh this page. <span style="opacity:.7">(' + esc(m) + ")</span></div>");
    }

    async function loadRooms() {
      clearTimeout(waitTimer);
      let q = sb.from("rooms").select("*").in("status", ["open", "closed"]).order("created_at", { ascending: false });
      const id = new URLSearchParams(location.search).get("room");
      if (id) q = q.eq("id", id);
      const { data, error } = await q;
      if (error) return fail(error.message);
      if (!data.length) {
        msg('<div class="note"><b>Voting hasn\'t started yet.</b>This page will update on its own when voting opens. <button class="link" onclick="loadRooms()">Check now</button></div>');
        waitTimer = setTimeout(loadRooms, 10000);
        return;
      }
      if (data.length === 1) return openRoom(data[0]);
      window._rooms = data;
      msg('<h2 class="section" style="margin-top:6px">Choose a session</h2><div class="bento">' + data.map((r) =>
        '<button class="tile session" data-room="' + r.id + '"><b>' + esc(r.title) + '</b><span class="sub">' + esc(r.description || "") + "</span></button>").join("") + "</div>");
      $("#msg").querySelectorAll("[data-room]").forEach((b) => (b.onclick = () => openRoom(window._rooms.find((x) => x.id === b.dataset.room))));
    }

    async function openRoom(r) {
      room = r;
      msg("");
      $("#title").textContent = r.title;
      $("#desc").textContent = r.description || "";
      ["tVotes", "tState", "tMine", "tabs"].forEach((id) => ($("#" + id).hidden = false));
      setTab(tab);
      await refresh();
      if (chan) sb.removeChannel(chan);
      chan = sb.channel("room-" + r.id)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "room_id=eq." + r.id }, refresh)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: "id=eq." + r.id }, (p) => { room = p.new; paint(); })
        .subscribe();
      clearInterval(timer);
      timer = setInterval(refresh, 15000); // safety net if the connection drops
    }

    async function refresh() {
      const [p, v] = await Promise.all([
        sb.from("participants").select("*").eq("room_id", room.id).order("vote_count", { ascending: false }).order("created_at"),
        sb.from("votes").select("participant_id").eq("room_id", room.id).maybeSingle(),
      ]);
      parts = sortedByVotes(p.data || []);
      myVote = v.data?.participant_id || null;
      paint();
    }

    function setTab(t) {
      tab = t;
      $("#voteView").hidden = t !== "vote";
      $("#liveWrap").hidden = t !== "live";
      $("#tabVote").setAttribute("aria-pressed", t === "vote");
      $("#tabLive").setAttribute("aria-pressed", t === "live");
      if (room && t === "live") renderBoard($("#board"), parts, { closed: room.status === "closed" });
    }

    function paint() {
      const open = room.status === "open";
      const total = parts.reduce((a, b) => a + b.vote_count, 0);

      $("#nVotes").textContent = total;
      $("#capVotes").textContent = (total === 1 ? "vote" : "votes") + (open ? " so far" : " in total");
      $("#stateWord").textContent = open ? "Open" : "Closed";
      $("#stateDot").classList.toggle("off", !open);
      $("#stateCap").textContent = open ? "one vote each" : "thank you for voting";

      const mine = parts.find((p) => p.id === myVote);
      $("#mineCap").textContent = mine ? "You voted for" : open ? "Your vote" : "Your vote";
      $("#mineBig").textContent = mine ? mine.name : open ? "Not yet. Pick one below." : "You didn't vote this time.";

      renderVote(open);
      renderBoard($("#board"), parts, { closed: !open });
      $("#liveNote").textContent = standingsNote(parts, !open);
    }

    function renderVote(open) {
      const list = [...parts].sort(byCreated); // stable order, so cards don't jump while people tap
      const sig = JSON.stringify([room.status, myVote, list.map((p) => [p.id, p.name, p.project, p.description])]);
      if (sig === voteSig) return;
      voteSig = sig;
      const host = $("#voteView");
      if (!list.length) { host.innerHTML = '<div class="note">No participants yet. Check back in a moment.</div>'; return; }

      const colors = colorMap(list);
      const hint = !open ? "Voting is closed. See the final scores under Live results."
        : myVote ? "Your vote is in. Changed your mind? Tap another one before voting closes."
        : "Tap Vote on the presentation you liked most. You get one vote.";

      host.innerHTML = '<p class="hint">' + hint + '</p><div class="picks">' + list.map((p) => {
        const first = esc(p.name.trim().split(/\s+/)[0]);
        const mineHere = myVote === p.id;
        const btn = !open ? "" : mineHere
          ? '<button class="btn block" disabled>Voted</button>'
          : '<button class="btn block" data-vote="' + p.id + '">' + (myVote ? "Switch my vote to " : "Vote for ") + first + "</button>";
        return '<article class="tile pick" style="--c:' + colors[p.id][0] + '">' +
          (mineHere ? '<span class="sticker">Your vote</span>' : "") +
          "<h2>" + esc(p.name) + '</h2><div class="proj">' + esc(p.project) + "</div>" +
          (p.description ? '<p class="desc">' + esc(p.description) + "</p>" : '<div style="height:18px"></div>') + btn + "</article>";
      }).join("") + "</div>";
    }

    async function castVote(pid) {
      if (room.status !== "open" || busy) return;
      busy = true;
      const changed = !!myVote;
      const { error } = await sb.from("votes").upsert(
        { room_id: room.id, participant_id: pid, voter_id: uid },
        { onConflict: "room_id,voter_id" });
      busy = false;
      if (error) return toast("Your vote didn't go through. Tap Vote to try again.");
      myVote = pid;
      if (navigator.vibrate) navigator.vibrate(40);
      toast(changed ? "Vote changed" : "Vote saved");
      await refresh();
    }
  </script>
</body>
</html>
