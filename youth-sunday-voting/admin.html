<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Get Kreative Voting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="hero">
    <img src="logo.png" alt="Get Kreative" class="gk-logo" onerror="this.style.display='none'"><br>
    <div class="gk-wordmark mb-2">Get <b>Kreative</b> Media</div>
    <small>⚙️ ADMIN</small>
    <h1>Voting Control Room</h1>
  </div>
  <div class="container-narrow" id="app"></div>
  <div class="gk-footer">A <b>Get Kreative Media</b> project</div>
  <div id="flash" class="flash d-none"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script>
    let rooms = [], cur = null, parts = [], chan = null;
    init();

    function flash(msg) { const f = $("#flash"); f.textContent = msg; f.classList.remove("d-none"); setTimeout(() => f.classList.add("d-none"), 2200); }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && !session.user.is_anonymous) return afterLogin();
      showLogin();
    }

    function showLogin(err = "") {
      $("#app").innerHTML = `
        <div class="card card-p"><div class="card-body">
          <h5 class="mb-3">Admin login</h5>
          ${err ? `<div class="alert alert-danger py-2">${esc(err)}</div>` : ""}
          <form onsubmit="login(event)">
            <input class="form-control mb-2" type="email" name="email" placeholder="Email" required autocomplete="username">
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required autocomplete="current-password">
            <button class="btn-brand w-100">Log in</button>
          </form>
        </div></div>`;
    }

    async function login(e) {
      e.preventDefault();
      const f = e.target;
      const { error } = await sb.auth.signInWithPassword({ email: f.email.value, password: f.password.value });
      if (error) return showLogin(error.message);
      afterLogin();
    }

    async function afterLogin() {
      const { data: { user } } = await sb.auth.getUser();
      const { data } = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
      if (!data) { await sb.auth.signOut(); return showLogin("This account is not an admin."); }
      loadRooms();
    }

    async function logout() { await sb.auth.signOut(); showLogin(); }

    // ---------- Room list ----------
    async function loadRooms() {
      const { data } = await sb.from("rooms").select("*").order("created_at", { ascending: false });
      rooms = data || [];
      viewList();
    }

    function badge(s) {
      return s === "open" ? '<span class="badge text-bg-success">Open</span>'
        : s === "closed" ? '<span class="badge text-bg-secondary">Closed</span>'
        : '<span class="badge text-bg-warning">Draft</span>';
    }

    function viewList() {
      cur = null;
      if (chan) { sb.removeChannel(chan); chan = null; }
      $("#app").innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Your sessions</h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Log out</button>
        </div>
        ${rooms.map(r => `
          <button class="btn btn-light card-p w-100 text-start p-3 mb-2" onclick="manage('${r.id}')">
            <div class="d-flex justify-content-between"><b>${esc(r.title)}</b>${badge(r.status)}</div>
            <small class="text-muted">${esc(r.description || "")}</small>
          </button>`).join("") || '<p class="text-muted">No sessions yet — create your first one below.</p>'}
        <div class="card card-p mt-4"><div class="card-body">
          <h6>➕ New session</h6>
          <form onsubmit="createRoom(event)">
            <input class="form-control mb-2" name="title" placeholder="Title e.g. Youth Sunday Presentations" required>
            <textarea class="form-control mb-3" name="description" rows="2" placeholder="Description (optional)"></textarea>
            <button class="btn-brand w-100">Create session</button>
          </form>
        </div></div>`;
    }

    async function createRoom(e) {
      e.preventDefault();
      const f = e.target;
      const { data, error } = await sb.from("rooms").insert({ title: f.title.value.trim(), description: f.description.value.trim() || null }).select().single();
      if (error) return alert(error.message);
      rooms.unshift(data);
      manage(data.id);
    }

    // ---------- Manage one room ----------
    async function manage(id) {
      cur = rooms.find(r => r.id === id);
      await loadParts();
      shell();
      renderParts();
      if (chan) sb.removeChannel(chan);
      chan = sb.channel("admin-" + id)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "room_id=eq." + id }, async () => { await loadParts(); renderParts(); })
        .subscribe();
    }

    async function loadParts() {
      const { data } = await sb.from("participants").select("*").eq("room_id", cur.id)
        .order("vote_count", { ascending: false }).order("created_at");
      parts = data || [];
    }

    function shell() {
      const voterUrl = new URL("index.html?room=" + cur.id, location.href).href;
      const screenUrl = new URL("screen.html?room=" + cur.id, location.href).href;
      $("#app").innerHTML = `
        <button class="btn btn-sm btn-link px-0 mb-2" onclick="loadRooms()">← All sessions</button>
        <div class="card card-p mb-3"><div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div><h5 class="mb-1">${esc(cur.title)}</h5><div class="small text-muted">${esc(cur.description || "")}</div></div>
            ${badge(cur.status)}
          </div>
          <div class="d-grid gap-2 mt-3">
            ${cur.status !== "open" ? `<button class="btn btn-success" onclick="setStatus('open')">▶ Open voting</button>` : ""}
            ${cur.status === "open" ? `<button class="btn btn-danger" onclick="setStatus('closed')">⏹ Close voting &amp; reveal winner</button>` : ""}
            ${cur.status === "closed" ? `<button class="btn btn-outline-secondary" onclick="setStatus('draft')">Back to draft</button>` : ""}
          </div>
        </div></div>

        <div class="card card-p mb-3"><div class="card-body text-center">
          <h6>📲 Share with the congregation</h6>
          <div id="qr" class="d-flex justify-content-center my-2"></div>
          <div class="input-group input-group-sm mb-2"><input class="form-control" readonly value="${voterUrl}" id="vlink"><button class="btn btn-outline-primary" onclick="copy('vlink')">Copy</button></div>
          <a class="btn btn-sm btn-outline-dark" href="${screenUrl}" target="_blank">🖥️ Open big-screen results</a>
        </div></div>

        <div class="card card-p mb-3"><div class="card-body">
          <h6>➕ Add participant</h6>
          <form onsubmit="addPart(event)">
            <input class="form-control mb-2" name="name" placeholder="Participant name" required>
            <input class="form-control mb-2" name="project" placeholder="Presentation / project title" required>
            <textarea class="form-control mb-3" name="description" rows="2" placeholder="Short description (optional)"></textarea>
            <button class="btn-brand w-100">Add participant</button>
          </form>
        </div></div>

        <h6 class="mb-2">Participants &amp; live votes</h6>
        <div id="plist"></div>

        <div class="d-grid gap-2 mt-4 mb-5">
          <button class="btn btn-outline-warning" onclick="resetVotes()">↺ Reset all votes to 0</button>
          <button class="btn btn-outline-danger" onclick="delRoom()">🗑 Delete this session</button>
        </div>`;
      new QRCode($("#qr"), { text: voterUrl, width: 170, height: 170 });
    }

    function renderParts() {
      const el = $("#plist"); if (!el) return;
      if (!parts.length) { el.innerHTML = '<p class="text-muted">No participants yet.</p>'; return; }
      const total = parts.reduce((a, b) => a + b.vote_count, 0);
      el.innerHTML = `<div class="small text-muted mb-2">${total} total votes</div>` + leaderboardHTML(parts) +
        `<details class="mt-2"><summary class="small text-muted">Remove a participant</summary>` +
        parts.map(p => `<div class="d-flex justify-content-between align-items-center py-1"><span>${esc(p.name)}</span><button class="btn btn-sm btn-outline-danger" onclick="delPart('${p.id}')">Remove</button></div>`).join("") +
        `</details>`;
    }

    async function setStatus(s) {
      if (s === "closed" && !confirm("Close voting? Members won't be able to vote or change votes.")) return;
      const { error } = await sb.from("rooms").update({ status: s }).eq("id", cur.id);
      if (error) return alert(error.message);
      cur.status = s; shell(); renderParts();
      flash(s === "open" ? "Voting is OPEN" : s === "closed" ? "Voting closed" : "Back to draft");
    }

    async function addPart(e) {
      e.preventDefault();
      const f = e.target;
      const { error } = await sb.from("participants").insert({
        room_id: cur.id, name: f.name.value.trim(), project: f.project.value.trim(), description: f.description.value.trim() || null });
      if (error) return alert(error.message);
      f.reset(); await loadParts(); renderParts(); flash("Participant added");
    }

    async function delPart(id) {
      if (!confirm("Remove this participant and their votes?")) return;
      await sb.from("participants").delete().eq("id", id);
      await loadParts(); renderParts();
    }

    async function resetVotes() {
      if (!confirm("Reset ALL votes in this session to zero?")) return;
      const { error } = await sb.rpc("reset_room_votes", { p_room: cur.id });
      if (error) return alert(error.message);
      await loadParts(); renderParts(); flash("Votes reset");
    }

    async function delRoom() {
      if (!confirm("Delete this whole session? This cannot be undone.")) return;
      await sb.from("rooms").delete().eq("id", cur.id);
      await loadRooms();
    }

    function copy(id) { const i = document.getElementById(id); i.select(); navigator.clipboard?.writeText(i.value); flash("Link copied"); }
  </script>
</body>
</html>
