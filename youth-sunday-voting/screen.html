<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live results | Get Kreative Media</title>
  <link href="style.css" rel="stylesheet">
</head>
<body class="screen">
  <main class="wrap">
    <header class="head">
      <div>
        <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>Get Kreative Media</span></div>
        <h1 id="title">Live results</h1>
      </div>
      <div class="meta">
        <div class="big" id="total">0</div>
        <div class="cap" id="cap">votes so far</div>
      </div>
    </header>
    <p class="hint" id="note"></p>
    <div class="bento" id="board"></div>
    <p class="foot">A Get Kreative Media project</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script>
    // Put this page on the church screen: screen.html?room=ROOM_ID (the admin page has the link).
    let room = null;
    (async function () {
      const id = new URLSearchParams(location.search).get("room");
      let q = sb.from("rooms").select("*").in("status", ["open", "closed"]).order("created_at", { ascending: false }).limit(1);
      if (id) q = sb.from("rooms").select("*").eq("id", id).limit(1);
      const { data } = await q;
      if (!data || !data.length) {
        $("#board").innerHTML = '<div class="tile empty">Waiting for voting to start. This screen will update on its own.</div>';
        setTimeout(() => location.reload(), 10000);
        return;
      }
      room = data[0];
      $("#title").textContent = room.title;
      await load();
      sb.channel("screen-" + room.id)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "room_id=eq." + room.id }, load)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: "id=eq." + room.id }, (p) => { room = p.new; load(); })
        .subscribe();
      setInterval(load, 15000);
    })();

    async function load() {
      const { data } = await sb.from("participants").select("*").eq("room_id", room.id)
        .order("vote_count", { ascending: false }).order("created_at");
      const parts = sortedByVotes(data || []);
      const closed = room.status === "closed";
      const total = parts.reduce((a, b) => a + b.vote_count, 0);
      $("#total").textContent = total;
      $("#cap").textContent = (total === 1 ? "vote" : "votes") + (closed ? " in total" : " so far");
      $("#note").textContent = closed ? standingsNote(parts, true) : "Voting is open. Vote from your phone and watch the scores move here.";
      renderBoard($("#board"), parts, { closed });
    }
  </script>
</body>
</html>
