<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Results Screen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="screen-body">
  <div class="container py-4" style="max-width:1000px">
    <div class="text-center mb-4">
      <img src="logo.png" alt="Get Kreative" class="gk-logo" onerror="this.style.display='none'"><br>
      <div class="gk-wordmark mb-2">Get <b>Kreative</b> Media</div>
      <div class="text-muted">🗳️ LIVE RESULTS</div>
      <h1 class="fw-bold display-5" id="title">Youth Sunday</h1>
      <div id="status"></div>
    </div>
    <div id="board"></div>
    <div class="gk-footer">A <b>Get Kreative Media</b> project</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // Project this page on the church screen: screen.html?room=ROOM_ID  (admin page gives you this link)
    let room = null;
    (async function () {
      const id = new URLSearchParams(location.search).get("room");
      let q = sb.from("rooms").select("*").in("status", ["open", "closed"]).order("created_at", { ascending: false }).limit(1);
      if (id) q = sb.from("rooms").select("*").eq("id", id).limit(1);
      const { data } = await q;
      if (!data || !data.length) { $("#board").innerHTML = "<p class='text-center text-muted fs-4'>Waiting for voting to start…</p>"; return; }
      room = data[0];
      $("#title").textContent = room.title;
      await load();
      sb.channel("screen-" + room.id)
        .on("postgres_changes", { event: "*", schema: "public", table: "participants", filter: "room_id=eq." + room.id }, load)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "rooms", filter: "id=eq." + room.id }, (p) => { room = p.new; load(); })
        .subscribe();
      setInterval(load, 15000);
    })();

    async function load() {
      const { data } = await sb.from("participants").select("*").eq("room_id", room.id)
        .order("vote_count", { ascending: false }).order("created_at");
      const total = (data || []).reduce((a, b) => a + b.vote_count, 0);
      $("#status").innerHTML = `<span class="badge ${room.status === "open" ? "text-bg-success" : "text-bg-secondary"} fs-6">${room.status === "open" ? "Voting open" : "Voting closed"}</span> <span class="text-muted ms-2">${total} votes</span>`;
      $("#board").innerHTML = leaderboardHTML(data || [], { big: true });
    }
  </script>
</body>
</html>
